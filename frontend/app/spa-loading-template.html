<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* Same as app.vue dark chrome — loading splash background */
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgb(230 215 133 / 0.03), transparent),
      linear-gradient(180deg, #141414 0%, #0a0a0a 100%);
  }

  @media (prefers-color-scheme: light) {
    html,
    body {
      background: #f0f1f3;
    }

    .cyrex-logo-wrap {
      background: #121212;
      border-radius: 50%;
      padding: 10%;
      box-sizing: border-box;
    }

    .logo-loader__ring {
      border-top-color: #dbc572;
      border-right-color: rgba(180, 131, 47, 0.3);
    }

    .logo-loader__ring--delayed {
      border-top-color: #b88935;
      border-right-color: transparent;
    }

    .animated-logo {
      filter: none;
      animation: logoPulse 1.4s ease-in-out infinite;
    }
  }

  * {
    --wails-draggable: drag;
  }

  /* Match CyrexAnimatedLogo.vue layout exactly — same center + 150px box */
  .animated-logo-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
    pointer-events: none;
    z-index: 1000;
  }

  .logo-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150px;
    height: 150px;
    z-index: 1001;
  }

  .logo-loader {
    position: absolute;
    inset: -18px;
    z-index: 0;
  }

  .logo-loader__ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #e6d785;
    border-right-color: rgba(180, 131, 47, 0.35);
    animation: logoSpin 1.1s linear infinite;
  }

  .logo-loader__ring--delayed {
    inset: 8px;
    border-top-color: #ccaa57;
    border-right-color: transparent;
    animation-duration: 1.6s;
    animation-direction: reverse;
  }

  .cyrex-logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    position: relative;
    z-index: 1;
  }

  .cyrex-logo {
    display: block;
    width: 100%;
    height: 100%;
  }

  .animated-logo {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 14px rgba(180, 131, 47, 0.45));
    animation: logoGlow 1.4s ease-in-out infinite;
  }

  @keyframes logoSpin {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes logoPulse {
    0%,
    100% {
      transform: scale(1);
    }
    50% {
      transform: scale(0.92);
    }
  }

  @keyframes logoGlow {
    0%,
    100% {
      filter: drop-shadow(0 0 12px rgba(180, 131, 47, 0.4));
      transform: scale(1);
    }
    50% {
      filter: drop-shadow(0 0 20px rgba(180, 131, 47, 0.55));
      transform: scale(0.92);
    }
  }
</style>
