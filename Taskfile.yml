version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  # darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "LagZap"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOHOSTOS:
    sh: go env GOHOSTOS
  GOHOSTARCH:
    sh: go env GOHOSTARCH
  # Override with VERSION=v0.2.0-beta.3. CI sets this from the git tag.
  VERSION: '{{.VERSION | default "v0.0.0-dev"}}'
  BUILD_NUMBER: '{{.BUILD_NUMBER | default "0"}}'
  RELEASES_REPO: '{{.RELEASES_REPO | default "lagzap/lagzap-releases"}}'
  UPDATE_MIRRORS: '{{.UPDATE_MIRRORS | default ""}}'
  CORE_VERSION:
    sh: |
      if [ -f ./../../cmd/internal/read_tag/main.go ]; then
        cd ./../.. && CGO_ENABLED=0 go run ./cmd/internal/read_tag/main.go
      else
        echo unknown
      fi

tasks:
  sync:version:
    summary: Sync VERSION/BUILD_NUMBER into Windows packaging metadata
    cmds:
      - go run ./build/scripts/setversion -version {{.VERSION}} -build {{.BUILD_NUMBER}} -root .

  build:
    summary: Builds the application
    deps:
      - task: sync:version
    cmds:
      - task: "{{OS}}:build"
        vars:
          BUILD_TYPE: '{{.BUILD_TYPE | default "beta"}}'
          VERSION: '{{.VERSION}}'
          CORE_VERSION: '{{.CORE_VERSION | default "unknown"}}'
          BUILD_NUMBER: '{{.BUILD_NUMBER}}'
          RELEASES_REPO: '{{.RELEASES_REPO}}'
          UPDATE_MIRRORS: '{{.UPDATE_MIRRORS}}'

  build:backend:
    summary: Builds the Go backend only (used by wails dev)
    cmds:
      - task: "{{OS}}:build:backend"
        vars:
          VERSION: '{{.VERSION}}'
          CORE_VERSION: '{{.CORE_VERSION | default "unknown"}}'
          RELEASES_REPO: '{{.RELEASES_REPO}}'
          UPDATE_MIRRORS: '{{.UPDATE_MIRRORS}}'

  package:
    summary: Packages a build of the application
    deps:
      - task: sync:version
    cmds:
      - task: "{{OS}}:package"
        vars:
          BUILD_TYPE: '{{.BUILD_TYPE | default "beta"}}'
          VERSION: '{{.VERSION}}'
          CORE_VERSION: '{{.CORE_VERSION | default "unknown"}}'
          BUILD_NUMBER: '{{.BUILD_NUMBER}}'
          RELEASES_REPO: '{{.RELEASES_REPO}}'
          UPDATE_MIRRORS: '{{.UPDATE_MIRRORS}}'

  release:windows:
    summary: Build Windows release artifacts (setup, zip, checksums)
    deps:
      - task: sync:version
    cmds:
      - task: windows:release
        vars:
          BUILD_TYPE: '{{.BUILD_TYPE | default "production"}}'
          VERSION: '{{.VERSION}}'
          CORE_VERSION: '{{.CORE_VERSION | default "unknown"}}'
          BUILD_NUMBER: '{{.BUILD_NUMBER}}'
          RELEASES_REPO: '{{.RELEASES_REPO}}'
          UPDATE_MIRRORS: '{{.UPDATE_MIRRORS}}'

  # Release CI runs these three in order and code-signs between them:
  # LagZap.exe after build, setup.exe after package (release-windows.yml).
  release:windows:build:
    summary: Build LagZap.exe for a release (step 1 of 3)
    deps:
      - task: sync:version
    cmds:
      - task: windows:build
        vars:
          BUILD_TYPE: '{{.BUILD_TYPE | default "production"}}'
          VERSION: '{{.VERSION}}'
          CORE_VERSION: '{{.CORE_VERSION | default "unknown"}}'
          BUILD_NUMBER: '{{.BUILD_NUMBER}}'
          RELEASES_REPO: '{{.RELEASES_REPO}}'
          UPDATE_MIRRORS: '{{.UPDATE_MIRRORS}}'

  release:windows:package:
    summary: Wrap the signed LagZap.exe in setup.exe (step 2 of 3)
    cmds:
      - task: windows:nsis:compile
      - task: windows:rename:artifacts

  release:windows:finish:
    summary: Updater zip and SHA256SUMS from the signed files (step 3 of 3)
    cmds:
      - task: windows:create:update:zip
      - task: windows:create:checksums

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    env:
      VERSION: '{{.VERSION}}'
      RELEASES_REPO: '{{.RELEASES_REPO}}'
      UPDATE_MIRRORS: '{{.UPDATE_MIRRORS}}'
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
