syntax = "proto3";

package lagzap;

option go_package = "github.com/lagzap/coordinator/services/lagzap";

// CMSMessage - Client to Server Message
message CMSMessage {
  string request = 1;
  bytes payload = 2;
  int64 timestamp = 3;
  string handle_id = 4;
}

// SMCMessage - Server to Client Message  
message SMCMessage {
  string response = 1;
  bytes payload = 2;
  int64 timestamp = 3;
  string handle_id = 4;
  bool success = 5;
}

// Error payload for error responses
message ErrorPayload {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// SessionPayload for session information
message SessionPayload {
  string device_hash = 1;
  string os = 2;
  string arch = 3;
  string app_version = 4;
  string client_version = 5;
}
message SessionCredentialsPayload {
  string user_id = 1;
  string session_id = 2;
  uint32 udp_connections = 3;
  string started_at = 4;
  optional string expires_at = 5;
}

// HeartbeatPayload for keepalive
message HeartbeatPayload {
  int64 timestamp = 1;
  string status = 2;
}

// NodesDataPayload for nodes information
message NodesDataPayload {
  repeated Node nodes = 1;
}

message Node {
  string id = 1;
  string name = 2;
  string status = 3;
  string region = 4;
  string area = 5;
  string country = 6;
  string city = 7;
  double latitude = 8;
  double longitude = 9;
  string ipv4 = 10;
  optional string ipv6 = 11;
  int32 echo_port = 12;
  optional int32 edge_port = 13;
  optional int32 relay_port = 14;
}

// TitlesDataPayload for titles information
message TitlesDataPayload {
  repeated Title titles = 1;
}

message Title {
  string id = 1;
  uint32 flags = 2;
  bool enabled = 3;
  string name = 4;
  optional string alias_name = 5;
  optional string icon_url = 6;
  optional string poster_url = 7;
  repeated Profile profiles = 8;
}

message Profile {
  string id = 1;
  uint32 flags = 2;
  string title_id = 3;
  string rule_id = 4;
  string name = 5;
  optional string description = 6;
  optional string process_regex = 7;
  string created_at = 8;
  string updated_at = 9;
}

message HeadlessRule {
  string id = 1;
  string tag = 2;
  optional string created_at = 3;
  optional string updated_at = 4;
}

// HeadlessRulesDataPayload for headless rules information
message HeadlessRulesDataPayload {
  repeated HeadlessRule rules = 1;
}

// RegionsDataPayload for regions information
message RegionsDataPayload {
  repeated Region regions = 1;
}

message Region {
  string tag = 1;
  string name = 2;
  string host = 3;
  bool active = 4;
}

message TitleAction {
  string title_id = 1;
  string action = 2;
}
