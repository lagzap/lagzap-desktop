name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (e.g. v0.1.0-beta.1). Must exist on this branch."
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: LagZap
  PUBLIC_RELEASES_REPO: lagzap/lagzap-releases
  INTERNAL_RELEASES_REPO: lagzap/lagzap-desktop
  GO_VERSION: "1.25.0"
  GOPRIVATE: github.com/lagzap/*
  GONOSUMDB: github.com/lagzap/*
  GIT_TERMINAL_PROMPT: "0"
  CI_SKIP_GO_MOD_TIDY: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Configure private Go modules
        shell: bash
        env:
          GO_MODULE_TOKEN: ${{ secrets.GO_MODULE_TOKEN }}
        run: |
          if [ -z "$GO_MODULE_TOKEN" ]; then
            echo "GO_MODULE_TOKEN secret missing — required to fetch private github.com/lagzap/* modules" >&2
            echo "Add a fine-grained PAT with Contents:Read on lagzap/echo, lagzap/lagzap, lagzap/zap, etc." >&2
            exit 1
          fi
          # Go on Windows reads %USERPROFILE%\_netrc (not only ~/.netrc from bash).
          printf 'machine github.com login x-access-token password %s\n' "$GO_MODULE_TOKEN" > "$USERPROFILE/_netrc"
          chmod 600 "$USERPROFILE/_netrc"
          printf 'machine github.com login x-access-token password %s\n' "$GO_MODULE_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git config --global url."https://x-access-token:${GO_MODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GO_MODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
          go env -w GOPRIVATE=github.com/lagzap/*
          go env -w GONOSUMDB=github.com/lagzap/*
          # Drop stale VCS metadata from earlier failed unauthenticated fetches.
          rm -rf "$(go env GOPATH)/pkg/mod/cache/vcs" 2>/dev/null || true

      - name: Verify private Go modules (go.mod pins)
        shell: bash
        run: |
          set -e
          go mod download
          go mod verify
          modules=(
            "github.com/lagzap/lagzap@$(go list -m -f '{{.Version}}' github.com/lagzap/lagzap)"
            "github.com/lagzap/zap@$(go list -m -f '{{.Version}}' github.com/lagzap/zap)"
            "github.com/lagzap/echo@$(go list -m -f '{{.Version}}' github.com/lagzap/echo)"
          )
          for mod in "${modules[@]}"; do
            echo "Resolved $mod"
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path "$nsis\makensis.exe")) {
            $nsis = Join-Path $env:ProgramFiles 'NSIS'
          }
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "makensis.exe not found after NSIS install"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          & "$nsis\makensis.exe" /VERSION

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.116

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Tag must start with v (got $TAG)" >&2
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          SEMVER="${TAG#v}"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          if [[ "$SEMVER" == *"-dev"* || "$SEMVER" == *"-beta"* || "$SEMVER" == *"-alpha"* || "$SEMVER" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$SEMVER" == *"-dev"* ]]; then
            CHANNEL=dev
          elif [[ "$SEMVER" == *"-alpha"* ]]; then
            CHANNEL=alpha
          elif [[ "$SEMVER" == *"-beta"* ]]; then
            CHANNEL=beta
          elif [[ "$SEMVER" == *"-rc"* ]]; then
            CHANNEL=rc
          else
            CHANNEL=stable
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

          # Internal channels land on lagzap/current; beta + public/stable/rc on lagzap-releases.
          case "$CHANNEL" in
            alpha|dev)
              RELEASES_REPO="${{ env.INTERNAL_RELEASES_REPO }}"
              ;;
            *)
              RELEASES_REPO="${{ env.PUBLIC_RELEASES_REPO }}"
              ;;
          esac
          echo "releases_repo=${RELEASES_REPO}" >> "$GITHUB_OUTPUT"
          echo "Publishing channel=${CHANNEL} → ${RELEASES_REPO}"

      - name: Render release notes
        shell: bash
        run: |
          go run ./build/scripts/releasenotes \
            -version "${{ steps.ver.outputs.version }}" \
            -build "${{ steps.ver.outputs.build_number }}" \
            -channel "${{ steps.ver.outputs.channel }}" \
            -public-repo "${{ steps.ver.outputs.releases_repo }}" \
            -output release-body.md

      # Respect go.sum — do not run go mod tidy in release CI (CI_SKIP_GO_MOD_TIDY).
      - name: Prepare frontend dependencies
        shell: bash
        run: bun install --cwd frontend

      # Azure code signing (Artifact Signing). Fails early, before the long
      # build, when a secret is missing.
      - name: Check code signing secrets
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          missing=0
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET TRUSTED_SIGNING_ENDPOINT TRUSTED_SIGNING_ACCOUNT TRUSTED_SIGNING_PROFILE; do
            if [ -z "${!name}" ]; then
              echo "$name secret missing (Azure code signing)" >&2
              missing=1
            fi
          done
          exit $missing

      - name: Build app
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
          RELEASES_REPO: ${{ steps.ver.outputs.releases_repo }}
          CORE_VERSION: unknown
          BUILD_TYPE: production
          UPDATE_MIRRORS: ${{ vars.UPDATE_MIRRORS }}
          GOPRIVATE: github.com/lagzap/*
          GONOSUMDB: github.com/lagzap/*
          GIT_TERMINAL_PROMPT: "0"
          CI_SKIP_GO_MOD_TIDY: "1"
        run: |
          task release:windows:build \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            RELEASES_REPO="$RELEASES_REPO" \
            UPDATE_MIRRORS="$UPDATE_MIRRORS" \
            CORE_VERSION="$CORE_VERSION" \
            BUILD_TYPE=production

      - name: Sign app
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\bin\LagZap.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: LagZap
          description-url: https://lagzap.com

      # The installer wraps the signed LagZap.exe, then is signed itself
      # before the updater zip and checksums are made.
      - name: Build installer
        shell: bash
        run: task release:windows:package

      - name: Sign installer
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\bin\LagZap-windows-amd64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: LagZap
          description-url: https://lagzap.com

      # Skipped for now (test certificate profile). Remove the `if` to turn
      # the check back on once a Public Trust profile is in use.
      - name: Verify signatures
        if: ${{ false }}
        shell: pwsh
        run: |
          # A test certificate profile ("Public Trust Test", subject says
          # TEST ONLY) signs fine but chains to a root Windows doesn't trust:
          # allowed, with a warning. Unsigned or any other failure stops.
          foreach ($f in 'bin\LagZap.exe', 'bin\LagZap-windows-amd64-setup.exe') {
            $sig = Get-AuthenticodeSignature $f
            $subject = "$($sig.SignerCertificate.Subject)"
            Write-Host "$f : $($sig.Status) ($subject)"
            if ($sig.Status -eq 'Valid') { continue }
            if ($sig.Status -eq 'UnknownError' -and $subject -match 'TEST ONLY') {
              Write-Host "::warning file=$f::Signed with a TEST certificate (untrusted root). Users will still see an unknown-publisher warning."
              continue
            }
            throw "$f is not validly signed: $($sig.StatusMessage)"
          }

      - name: Updater zip and checksums
        shell: bash
        run: task release:windows:finish

      - name: Sign update artifacts
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          VERSION: ${{ steps.ver.outputs.semver }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          if [ -z "$UPDATER_PRIVATE_KEY" ]; then
            echo "UPDATER_PRIVATE_KEY secret missing" >&2
            exit 1
          fi
          printf '%s\n' "$UPDATER_PRIVATE_KEY" > updater.key
          ZIP="bin/${APP_NAME}-windows-amd64.zip"
          wails3 updater sign -key updater.key "$ZIP"
          wails3 updater manifest \
            -key updater.key \
            -version "$VERSION" \
            -channel "$CHANNEL" \
            -name "LagZap $VERSION" \
            -notes-file release-body.md \
            -output bin/update.manifest.json \
            "$ZIP"
          rm -f updater.key

      - name: Publish to releases repo
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_TOKEN }}
          repository: ${{ steps.ver.outputs.releases_repo }}
          tag_name: ${{ steps.ver.outputs.version }}
          name: LagZap ${{ steps.ver.outputs.semver }}
          body_path: release-body.md
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            bin/LagZap-windows-amd64.zip
            bin/LagZap-windows-amd64-setup.exe
            bin/SHA256SUMS
            bin/update.manifest.json

      # Notes only: the release is already published above, so a failure here
      # never fails the release. Edits a release made by hand for the tag
      # (or by the publish step for internal channels) instead of creating one,
      # and prints GitHub's real error when it can't.
      # Update mirrors tried before GitHub (constant.UpdateMirrors): Arvan
      # object storage and Cloudflare R2, both S3-compatible. The zip goes up
      # before the manifest, so a manifest never points at a missing file. A
      # mirror without its secrets is skipped.
      - name: Upload update to mirrors
        shell: bash
        env:
          CHANNEL: ${{ steps.ver.outputs.channel }}
          ARVAN_S3_ENDPOINT: ${{ secrets.ARVAN_S3_ENDPOINT }}
          ARVAN_S3_BUCKET: ${{ secrets.ARVAN_S3_BUCKET }}
          ARVAN_S3_ACCESS_KEY: ${{ secrets.ARVAN_S3_ACCESS_KEY }}
          ARVAN_S3_SECRET_KEY: ${{ secrets.ARVAN_S3_SECRET_KEY }}
          CF_R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          CF_R2_ACCESS_KEY: ${{ secrets.CF_R2_ACCESS_KEY }}
          CF_R2_SECRET_KEY: ${{ secrets.CF_R2_SECRET_KEY }}
        run: |
          upload() {
            local name=$1 endpoint=$2 bucket=$3 key=$4 secret=$5 region=$6 acl=$7
            if [ -z "$endpoint" ] || [ -z "$bucket" ] || [ -z "$key" ] || [ -z "$secret" ]; then
              echo "$name: secrets not set, skipped"
              return 0
            fi
            local dest="s3://${bucket}/${CHANNEL}/windows"
            for f in "bin/${APP_NAME}-windows-amd64.zip" bin/update.manifest.json; do
              AWS_ACCESS_KEY_ID="$key" AWS_SECRET_ACCESS_KEY="$secret" AWS_DEFAULT_REGION="$region" \
                aws s3 cp "$f" "${dest}/$(basename "$f")" --endpoint-url "$endpoint" ${acl:+--acl "$acl"} --only-show-errors
            done
            echo "$name: uploaded to ${dest}"
          }
          # Arvan objects are made public per object; R2 has no object ACLs
          # (its bucket's public domain serves them).
          upload arvan "$ARVAN_S3_ENDPOINT" "$ARVAN_S3_BUCKET" "$ARVAN_S3_ACCESS_KEY" "$ARVAN_S3_SECRET_KEY" default public-read
          upload cloudflare "$CF_R2_ENDPOINT" "$CF_R2_BUCKET" "$CF_R2_ACCESS_KEY" "$CF_R2_SECRET_KEY" auto ""

      - name: Mirror release notes on lagzap-desktop (private)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.version }}
          TITLE: LagZap ${{ steps.ver.outputs.semver }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -e
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file release-body.md \
              --prerelease="$PRERELEASE" --draft=false --latest=false
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TITLE" --notes-file release-body.md \
              --prerelease="$PRERELEASE" --latest=false
          fi
