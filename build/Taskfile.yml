version: '3'

tasks:
  go:mod:tidy:
    summary: Syncs Go modules (go.work) or tidies go.mod (CI)
    internal: true
    run: once
    deps:
      - task: go:work:sync
      - task: go:mod:tidy:only

  go:work:sync:
    summary: Runs `go work sync` when go.work is present
    internal: true
    status:
      - sh: 'test ! -f go.work'
    cmds:
      - go work sync

  go:mod:tidy:only:
    summary: Runs `go mod tidy` when go.work is absent (skipped when CI_SKIP_GO_MOD_TIDY is set)
    internal: true
    run: once
    status:
      - sh: 'test -f go.work || test -n "$CI_SKIP_GO_MOD_TIDY"'
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    deps:
      - task: go:mod:tidy
    sources:
      - package.json
      - bun.lockb
    generates:
      - node_modules/*
    preconditions:
      - sh: bun
        msg: "Looks like bun isn't installed: https://bun.sh/"
    cmds:
      - bun install

  build:frontend:
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
      - "!/.nuxt/**"
      - "!/.output/**"
      - "!/dist/**"
      - "!/node_modules/**"
    generates:
      - .output/public/**
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - '{{.BUILD_COMMAND}}'
    env:
      BUILD_TYPE: '{{.BUILD_TYPE | default "beta"}}'
      NODE_ENV: 'production'
    vars:
      BUILD_COMMAND: '{{if eq .BUILD_TYPE "production"}}bun run production{{else}}bun run build{{end}}'
      BUILD_TYPE: '{{.BUILD_TYPE | default "beta"}}'

  generate:bindings:
    summary: Generates bindings for the frontend
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "frontend/bindings/**/*"
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true

  generate:bindings:obfuscated:
    summary: Generates obfuscated bindings + wails_obfuscated.gen.go (commit the gen file)
    deps:
      - task: go:mod:tidy
    cmds:
      - wails3 generate bindings -obfuscated -f '{{.BUILD_FLAGS}}'
    vars:
      BUILD_FLAGS: '-tags production,with_gvisor,with_dhcp,with_coordinator,tfogo_checklinkname0'

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` files from an image
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "icons.icns"
      - "icons.ico"
    cmds:
      - wails3 generate icons -input appicon.png -windowsfilename windows/icons.ico

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    env:
      BUILD_TYPE: 'local'
      NODE_ENV: 'development'
      WAILS_VITE_PORT: '{{.VITE_PORT}}'
      FRONTEND_DEVSERVER_URL: 'http://127.0.0.1:{{.VITE_PORT}}'
    deps:
      - task: install:frontend:deps
    cmds:
      - bun run dev -- --port {{.VITE_PORT}} --host 127.0.0.1

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .