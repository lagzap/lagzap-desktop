# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "cyrex"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "A cutting-edge lag elimination software powered by LagZap protocol designed to deliver a seamless and smooth experience"
vendor: "Cyrex"
homepage: "https://www.cyrex.online"
license: "private"
release: "1"

contents:
  - src: "./bin/lagzap"
    dst: "/usr/local/bin/lagzap"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/lagzap.png"
  - src: "./build/linux/lagzap.desktop"
    dst: "/usr/share/applications/lagzap.desktop"

replaces:
  - foobar
provides:
  - bar
depends:
  - gtk3
  - libwebkit2gtk
recommends:
  - whatever
suggests:
  - something-else
conflicts:
  - not-foo
  - not-bar
changelog: "changelog.yaml"
scripts:
  preinstall: ./build/linux/nfpm/scripts/preinstall.sh
  postinstall: ./build/linux/nfpm/scripts/postinstall.sh
  preremove: ./build/linux/nfpm/scripts/preremove.sh
  postremove: ./build/linux/nfpm/scripts/postremove.sh
