# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "lagzap" # The name of the company
  productName: "LagZap" # The name of the application
  productIdentifier: "com.lagzap" # The unique product identifier
  description: "LagZap" # The application description
  copyright: "(c) 2025, LagZap" # Copyright text
  comments: "LagZap" # Comments
  version: "0.0.0.0" # The application version
# Dev mode configuration
dev_mode:
  # Watch the lagzap core too (go.work points at it), so core edits rebuild
  # the app. Every command still runs from clients/desktop.
  root_path: ../..
  log_level: warn
  debounce: 5000
  ignore:
    dir:
      - .git
      - .claude
      - .idea
      - .vscode
      - .cursor
      - .continue
      - .github
      - node_modules
      - frontend
      - bin
      - release
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      dir: clients/desktop
      type: once
    - cmd: wails3 task common:dev:frontend
      dir: clients/desktop
      type: background
    - cmd: wails3 task build:backend
      dir: clients/desktop
      type: blocking
    - cmd: wails3 task run
      dir: clients/desktop
      type: primary

