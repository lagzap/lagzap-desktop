<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LagZap Update</title>
<style>
:root {
  --bg: #121212;
  --surface: #1e1e1e;
  --surface-2: #2a2a2a;
  --border: #2d2d2d;
  --fg: rgba(255, 255, 255, 0.92);
  --fg-dim: rgba(255, 255, 255, 0.62);
  --fg-faint: rgba(255, 255, 255, 0.42);
  --gold: #e6d785;
  --gold-mid: #ccaa57;
  --gold-dark: #b4832f;
  --on-gold: #121212;
  --success: #4caf7a;
  --error: #ef5350;
  --radius: 12px;
  --radius-pill: 999px;
  --font: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  --logo: 120px;
  --loader-outset: 16px;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 var(--font);
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

.cx {
  display: flex;
  flex-direction: column;
  height: 100%;
  --wails-draggable: drag;
}

.cx-stage {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 28px 20px;
  gap: 0;
}

/* Centered logo + loader (start-service style) */
.cx-logo-wrap {
  position: relative;
  width: var(--logo);
  height: var(--logo);
  flex: 0 0 auto;
}
.cx-loader {
  position: absolute;
  inset: calc(var(--loader-outset) * -1);
  z-index: 0;
  display: none;
}
.cx[data-state="checking"] .cx-loader--spin,
.cx[data-state="verifying"] .cx-loader--spin,
.cx[data-state="installing"] .cx-loader--spin,
.cx[data-state="up-to-date"] .cx-loader--spin {
  display: block;
}
.cx[data-state="downloading"] .cx-loader--progress {
  display: block;
}

.cx-loader__ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--gold);
  border-right-color: rgba(180, 131, 47, 0.35);
  animation: cx-spin 1.1s linear infinite;
}
.cx-loader__ring--delayed {
  inset: 8px;
  border-top-color: var(--gold-mid);
  border-right-color: transparent;
  animation-duration: 1.6s;
  animation-direction: reverse;
}
@keyframes cx-spin { to { transform: rotate(360deg); } }

.cx-progress-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.cx-progress__track {
  stroke: rgba(180, 131, 47, 0.14);
  fill: none;
}
.cx-progress__arc {
  stroke: var(--gold);
  fill: none;
  stroke-linecap: round;
  transition: stroke-dasharray 0.28s ease;
}

.cx-mark {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: block;
  filter: drop-shadow(0 0 14px rgba(180, 131, 47, 0.45));
}
.cx[data-loading="1"] .cx-mark {
  animation: cx-glow 1.4s ease-in-out infinite;
}
@keyframes cx-glow {
  0%, 100% {
    filter: drop-shadow(0 0 12px rgba(180, 131, 47, 0.4));
    transform: scale(1);
  }
  50% {
    filter: drop-shadow(0 0 20px rgba(180, 131, 47, 0.55));
    transform: scale(0.92);
  }
}

.cx-name {
  margin-top: 32px;
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--fg);
  flex: 0 0 auto;
}

.cx-name-z { color: #ffc107; }

.cx-status {
  margin-top: 10px;
  font-size: 15px;
  font-weight: 500;
  text-align: center;
  color: var(--fg-dim);
  max-width: 320px;
  min-height: 1.4em;
  flex: 0 0 auto;
}
.cx--ready .cx-status,
.cx--up-to-date .cx-status { color: var(--success); }
.cx--error .cx-status { color: #ff8a80; }

.cx-version {
  margin-top: 6px;
  font-size: 12px;
  color: var(--fg-faint);
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  min-height: 0;
}
.cx-version:empty { display: none; }
.cx-ver-from { text-decoration: line-through; }
.cx-ver-to { font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.cx-size { font-variant-numeric: tabular-nums; }

.cx-progress-meta {
  margin-top: 14px;
  width: min(280px, 100%);
  display: none;
  flex-direction: column;
  gap: 8px;
  flex: 0 0 auto;
  --wails-draggable: none;
}
.cx[data-state="downloading"] .cx-progress-meta { display: flex; }
.cx-progress-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--fg-dim);
  gap: 12px;
}
.cx-progress-state { font-weight: 500; color: var(--fg); }
.cx-progress-rate { font-variant-numeric: tabular-nums; color: var(--fg-faint); }
.cx-bar {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  border: none;
  border-radius: var(--radius-pill);
  background: rgba(180, 131, 47, 0.14);
  overflow: hidden;
}
.cx-bar::-webkit-progress-bar { background: rgba(180, 131, 47, 0.14); border-radius: var(--radius-pill); }
.cx-bar::-webkit-progress-value { background: var(--gold); border-radius: var(--radius-pill); }
.cx-bar::-moz-progress-bar { background: var(--gold); border-radius: var(--radius-pill); }

.cx-error {
  display: none;
  margin-top: 14px;
  width: min(340px, 100%);
  background: rgba(239, 83, 80, 0.1);
  border: 1px solid rgba(239, 83, 80, 0.35);
  color: #ff8a80;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 12.5px;
  line-height: 1.45;
  text-align: center;
  --wails-draggable: none;
}
.cx[data-state="error"] .cx-error { display: block; }

/* Content card — only when an update is available / ready */
.cx-panel {
  display: none;
  width: min(400px, 100%);
  margin-top: 22px;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  min-height: 0;
  max-height: 220px;
  --wails-draggable: none;
}
.cx[data-state="available"] .cx-panel,
.cx[data-state="ready"] .cx-panel {
  display: flex;
}
.cx-notes-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-faint);
  flex: 0 0 auto;
}
.cx-notes {
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  overflow: auto;
  color: var(--fg-dim);
  font-size: 12.5px;
  line-height: 1.55;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.cx-notes:empty { display: none; }
.cx-notes::-webkit-scrollbar { width: 8px; }
.cx-notes::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
.cx-notes p { margin: 0 0 8px; }
.cx-notes p:last-child { margin-bottom: 0; }
.cx-notes strong { color: var(--fg); font-weight: 600; }
.cx-notes em { font-style: italic; }
.cx-notes code {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 11px;
  padding: 1px 5px;
  background: #333;
  border-radius: 4px;
  color: var(--gold);
}
.cx-notes pre {
  background: #333;
  padding: 10px 12px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
  font-size: 11px;
}
.cx-notes pre code { background: none; padding: 0; color: var(--fg); }
.cx-notes ul, .cx-notes ol { margin: 4px 0 8px; padding-left: 20px; }
.cx-notes li { margin: 3px 0; }
.cx-notes h1, .cx-notes h2, .cx-notes h3 {
  margin: 10px 0 6px;
  font-weight: 600;
  font-size: 13px;
  color: var(--fg);
}
.cx-notes table {
  border-collapse: collapse;
  width: 100%;
  max-width: 100%;
  margin: 8px 0;
  font-size: 11.5px;
  display: block;
  overflow-x: auto;
}
.cx-notes th, .cx-notes td {
  padding: 6px 10px;
  border: 1px solid var(--border);
  text-align: left;
  white-space: normal;
  overflow-wrap: anywhere;
}
.cx-notes th { background: #333; color: var(--fg); font-weight: 600; }
.cx-notes a { color: var(--gold); text-decoration: none; }
.cx-notes a:hover { text-decoration: underline; }

/* Actions */
.cx-actions {
  display: none;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
  padding: 0 22px 18px;
  --wails-draggable: none;
}
.cx[data-state="available"] .cx-actions,
.cx[data-state="ready"] .cx-actions,
.cx[data-state="error"] .cx-actions,
.cx[data-state="downloading"] .cx-actions {
  display: flex;
}
.cx-secondary { display: flex; gap: 4px; }
.cx-primary { display: flex; gap: 8px; margin-left: auto; }

.cx-btn {
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  border: none;
  background: transparent;
  color: var(--fg-dim);
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
  white-space: nowrap;
  display: none;
}
.cx-btn:hover:not(:disabled) {
  background: var(--surface-2);
  color: var(--fg);
}
.cx-btn:disabled { opacity: 0.38; cursor: default; }
.cx-btn--ghost { padding: 8px 10px; }
.cx-btn--outline {
  background: var(--surface-2);
  color: var(--fg);
  border: 1px solid var(--border);
}
.cx-btn--outline:hover:not(:disabled) { background: #333; }
.cx-btn--gold {
  background: var(--gold);
  color: var(--on-gold);
  padding: 8px 20px;
}
.cx-btn--gold:hover:not(:disabled) { filter: brightness(1.06); }

.cx[data-state="available"] #btn-skip,
.cx[data-state="available"] #btn-remind,
.cx[data-state="available"] #btn-install,
.cx[data-state="downloading"] #btn-cancel,
.cx[data-state="ready"] #btn-cancel,
.cx[data-state="ready"] #btn-restart,
.cx[data-state="error"] #btn-error-skip,
.cx[data-state="error"] #btn-retry {
  display: inline-flex;
}
</style>
</head>
<body>
<main class="cx wails-updater" id="root" data-state="checking" data-loading="1" data-wails-updater-window="1">
  <div class="cx-stage">
    <div class="cx-logo-wrap" aria-hidden="true">
      <div class="cx-loader cx-loader--spin">
        <span class="cx-loader__ring"></span>
        <span class="cx-loader__ring cx-loader__ring--delayed"></span>
      </div>
      <div class="cx-loader cx-loader--progress">
        <svg class="cx-progress-svg" id="progress-svg" viewBox="0 0 152 152" width="152" height="152">
          <circle class="cx-progress__track" cx="76" cy="76" r="75" stroke-width="1.75"></circle>
          <circle class="cx-progress__arc" id="progress-arc" cx="76" cy="76" r="75" stroke-width="1.75"
            transform="rotate(-90 76 76)" stroke-dasharray="0 471.24"></circle>
        </svg>
      </div>
      <svg class="cx-mark" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ffc107" d="M1007.23,56.61c-109.38,105.29-218.75,210.59-328.12,315.89-118.62,0-237.25,0-355.87.02-8.49,0-5.95-1.22-12.01,5.17-12.24,12.91-24.4,25.89-36.6,38.84-13.33,14.15-26.68,28.28-40,42.44-.57.6-1.46,1.15-1,2.68,2.63.51,5.44.34,8.22.34,94.34,0,188.69,0,283.03,0,1.78,0,3.55-.02,5.33.03.66.02,1.31.22,3.03.52-2.46,3.11-4.24,5.44-6.1,7.69-136.89,165.87-273.78,331.74-410.68,497.6-14.3,17.32-28.6,34.64-42.86,52.01-.76.92-2.33,1.54-1.59,3.55,1.24-1.18,2.43-2.3,3.61-3.43,21.88-21.03,43.77-42.05,65.64-63.1,86.1-82.88,172.2-165.75,258.29-248.63,119.21.01,238.42.02,357.63,0,6.71,0,5.09.88,10.16-4.5,24.78-26.29,49.54-52.6,74.3-78.9,1.26-1.33,2.51-2.67,3.71-4.07.42-.49.66-1.17,1.22-2.18-2.49-.59-4.59-.37-6.66-.37-93.98-.01-187.97,0-281.95-.01-2.84,0-5.69-.03-8.53-.11-.82-.02-1.82.19-2.45-1.5,25.46-30.88,51.11-61.93,76.74-92.99,25.67-31.1,51.33-62.2,77-93.3,25.55-30.96,51.1-61.91,76.65-92.87,25.67-31.1,51.33-62.2,77-93.29,25.67-31.1,51.35-62.18,77-93.3,25.61-31.08,51.36-62.02,76.79-93.27-.31-.32-.62-.63-.93-.95Z"/>
      </svg>
    </div>

    <div class="cx-name">Lag<span class="cx-name-z">Z</span>ap</div>
    <div class="cx-status" id="title">Checking for updates</div>
    <div class="cx-version" id="subtitle"></div>

    <div class="cx-progress-meta">
      <div class="cx-progress-row">
        <span class="cx-progress-state" id="progress-state">Downloading…</span>
        <span class="cx-progress-rate" id="progress-rate"></span>
      </div>
      <progress class="cx-bar" id="bar" max="100" value="0"></progress>
    </div>

    <div class="cx-error" id="error-text">An error occurred.</div>

    <section class="cx-panel" id="panel">
      <div class="cx-notes-label">What's new</div>
      <div class="cx-notes" id="notes"></div>
    </section>
  </div>

  <footer class="cx-actions">
    <div class="cx-secondary">
      <button class="cx-btn cx-btn--ghost" id="btn-skip" type="button">Skip version</button>
      <button class="cx-btn cx-btn--ghost" id="btn-remind" type="button">Remind later</button>
      <button class="cx-btn cx-btn--outline" id="btn-error-skip" type="button">Skip</button>
    </div>
    <div class="cx-primary">
      <button class="cx-btn cx-btn--outline" id="btn-cancel" type="button">Close</button>
      <button class="cx-btn cx-btn--gold" id="btn-install" type="button">Install update</button>
      <button class="cx-btn cx-btn--gold" id="btn-restart" type="button">Restart &amp; apply</button>
      <button class="cx-btn cx-btn--gold" id="btn-retry" type="button">Retry</button>
    </div>
  </footer>
</main>

<script>
(function () {
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);

  var Events = window.wails.Events;
  var ARC_LEN = 2 * Math.PI * 75;

  var els = {
    root: document.getElementById("root"),
    title: document.getElementById("title"),
    subtitle: document.getElementById("subtitle"),
    notes: document.getElementById("notes"),
    progress: document.getElementById("bar"),
    progressArc: document.getElementById("progress-arc"),
    progressRate: document.getElementById("progress-rate"),
    progressState: document.getElementById("progress-state"),
    error: document.getElementById("error-text"),
    btnInstall: document.getElementById("btn-install"),
    btnSkip: document.getElementById("btn-skip"),
    btnRemind: document.getElementById("btn-remind"),
    btnCancel: document.getElementById("btn-cancel"),
    btnRestart: document.getElementById("btn-restart"),
    btnRetry: document.getElementById("btn-retry"),
    btnErrorSkip: document.getElementById("btn-error-skip"),
  };

  var RANK = {
    "": 0,
    "checking": 1,
    "available": 2,
    "downloading": 3,
    "verifying": 4,
    "installing": 5,
    "ready": 6,
    "up-to-date": 6,
    "error": 99
  };
  var rank = 0;
  var errored = false;
  var currentRelease = null;
  var currentVersion = null;

  function setLoading(on) {
    els.root.setAttribute("data-loading", on ? "1" : "0");
  }

  function setArcPct(pct) {
    var p = Math.max(0, Math.min(100, pct || 0));
    var filled = (p / 100) * ARC_LEN;
    els.progressArc.setAttribute("stroke-dasharray", filled + " " + ARC_LEN);
  }

  function setState(name) {
    if (errored && name !== "error") return false;
    if (name === "error") {
      errored = true;
    } else {
      if ((RANK[name] || 0) < rank) return false;
      rank = RANK[name] || 0;
    }
    els.root.setAttribute("data-state", name);
    els.root.classList.toggle("cx--ready", name === "ready");
    els.root.classList.toggle("cx--up-to-date", name === "up-to-date");
    els.root.classList.toggle("cx--error", name === "error");
    setLoading(name === "checking" || name === "downloading" || name === "verifying" || name === "installing");
    return true;
  }

  function renderMarkdown(src) {
    if (!src) return "";
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function inline(s) {
      s = s.replace(/`([^`]+)`/g, function (_, c) { return "<code>" + c + "</code>"; });
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
      s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      return s;
    }
    var lines = escapeHtml(src).split(/\r?\n/);
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var L = lines[i];
      if (/^```/.test(L)) {
        var buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        out.push("<pre><code>" + buf.join("\n") + "</code></pre>");
        i++; continue;
      }
      var h = /^(#{1,6})\s+(.+)$/.exec(L);
      if (h) {
        var lvl = Math.min(h[1].length, 3);
        out.push("<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">");
        i++; continue;
      }
      if (/^\|.*\|$/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|$/.test(lines[i + 1])) {
        var rows = [L];
        i += 2;
        while (i < lines.length && /^\|.*\|$/.test(lines[i])) { rows.push(lines[i]); i++; }
        var html = "<table>";
        rows.forEach(function (r, idx) {
          var cells = r.replace(/^\||\|$/g, "").split("|").map(function (c) { return inline(c.trim()); });
          var tag = idx === 0 ? "th" : "td";
          html += "<tr><" + tag + ">" + cells.join("</" + tag + "><" + tag + ">") + "</" + tag + "></tr>";
        });
        html += "</table>";
        out.push(html);
        continue;
      }
      var ulRe = /^[-*]\s+(.+)$/;
      var olRe = /^\d+\.\s+(.+)$/;
      if (ulRe.test(L) || olRe.test(L)) {
        var isOL = olRe.test(L);
        var re = isOL ? olRe : ulRe;
        var items = [];
        while (i < lines.length && re.test(lines[i])) {
          items.push("<li>" + inline(re.exec(lines[i])[1]) + "</li>");
          i++;
        }
        out.push("<" + (isOL ? "ol" : "ul") + ">" + items.join("") + "</" + (isOL ? "ol" : "ul") + ">");
        continue;
      }
      if (L.trim() === "") { i++; continue; }
      var para = [L];
      i++;
      while (i < lines.length && lines[i].trim() !== "" && !/^[-*]\s/.test(lines[i]) && !/^\d+\.\s/.test(lines[i]) && !/^\|.*\|$/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) && !/^```/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  function fmtBytes(n) {
    if (!n || n <= 0) return "";
    var u = ["B", "KB", "MB", "GB"], k = 1024;
    var i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(k)));
    return (n / Math.pow(k, i)).toFixed(i === 0 ? 0 : 1) + " " + u[i];
  }
  function fmtRate(bps) {
    var s = fmtBytes(bps);
    return s ? s + "/s" : "";
  }

  function renderSubtitle(rel) {
    if (!rel) { els.subtitle.textContent = ""; return; }
    els.subtitle.innerHTML = "";
    if (currentVersion) {
      var from = document.createElement("span"); from.className = "cx-ver-from"; from.textContent = currentVersion;
      var arr = document.createElement("span"); arr.className = "cx-ver-arrow"; arr.textContent = "→";
      els.subtitle.appendChild(from);
      els.subtitle.appendChild(arr);
    }
    if (rel.version) {
      var to = document.createElement("span"); to.className = "cx-ver-to"; to.textContent = "v" + rel.version;
      els.subtitle.appendChild(to);
    }
    var size = (rel.artifact && rel.artifact.size) || 0;
    if (size > 0) {
      var sz = document.createElement("span"); sz.className = "cx-size"; sz.textContent = "· " + fmtBytes(size);
      els.subtitle.appendChild(sz);
    }
  }

  function fillNotes(rel) {
    els.notes.innerHTML = (rel && rel.notes) ? renderMarkdown(rel.notes) : "";
  }

  function onCheckStarted() {
    if (!setState("checking")) return;
    els.title.textContent = "Checking for updates";
    els.subtitle.textContent = "";
    els.error.textContent = "";
    setArcPct(0);
  }
  function onUpdateAvailable(rel) {
    currentRelease = rel || null;
    if (!setState("available")) return;
    els.title.textContent = "Update available";
    renderSubtitle(rel);
    fillNotes(rel);
  }
  function onNoUpdate() {
    if (!setState("up-to-date")) return;
    els.title.textContent = "You're up to date";
    els.subtitle.innerHTML = "";
    if (currentVersion) {
      var v = document.createElement("span");
      v.className = "cx-ver-to";
      v.textContent = "v" + currentVersion;
      els.subtitle.appendChild(v);
    }
  }
  function onDownloadStarted() {
    if (!setState("downloading")) return;
    els.title.textContent = "Downloading update";
    els.progressState.textContent = "Starting download…";
    els.progressRate.textContent = "";
    els.progress.removeAttribute("value");
    setArcPct(0);
  }
  function onDownloadProgress(p) {
    if (!p) return;
    if (rank !== RANK.downloading) return;
    if (p.total > 0) {
      els.progress.max = p.total;
      els.progress.value = p.written;
      var pct = Math.round((p.written / p.total) * 100);
      els.progressState.textContent = pct + "% · " + fmtBytes(p.written) + " of " + fmtBytes(p.total);
      setArcPct(pct);
    } else {
      els.progress.removeAttribute("value");
      els.progressState.textContent = "Downloaded " + fmtBytes(p.written);
    }
    els.progressRate.textContent = p.rate ? fmtRate(p.rate) : "";
  }
  function onVerifying() {
    if (!setState("verifying")) return;
    els.title.textContent = "Verifying update";
    setArcPct(100);
  }
  function onInstalling() {
    if (!setState("installing")) return;
    els.title.textContent = "Installing update";
  }
  function onUpdateReady() {
    if (!setState("ready")) return;
    els.title.textContent = "Update ready";
    if (currentRelease) {
      renderSubtitle(currentRelease);
      fillNotes(currentRelease);
    }
  }
  function onError(info) {
    setState("error");
    var stage = info && info.stage;
    els.title.textContent = stage === "check" ? "Couldn't check for updates" : "Update failed";
    var msg = (info && info.message) ? info.message : "An unexpected error occurred.";
    if (stage) msg = "During " + stage + ": " + msg;
    els.error.textContent = msg;
  }

  function resetForRetry() {
    errored = false;
    rank = 0;
    setState("checking");
    els.title.textContent = "Checking for updates";
    els.subtitle.textContent = "";
    els.error.textContent = "";
    setArcPct(0);
  }

  Events.On("wails:updater:meta", function (e) {
    var m = e && (e.data != null ? e.data : e);
    if (m && typeof m.currentVersion === "string") currentVersion = m.currentVersion;
  });
  Events.On("wails:updater:check-started", function () { onCheckStarted(); });
  Events.On("wails:updater:update-available", function (e) { onUpdateAvailable(e && (e.data != null ? e.data : e)); });
  Events.On("wails:updater:no-update", function () { onNoUpdate(); });
  Events.On("wails:updater:download-started", function () { onDownloadStarted(); });
  Events.On("wails:updater:download-progress", function (e) { onDownloadProgress(e && (e.data != null ? e.data : e)); });
  Events.On("wails:updater:download-complete", function () {});
  Events.On("wails:updater:verifying", function () { onVerifying(); });
  Events.On("wails:updater:installing", function () { onInstalling(); });
  Events.On("wails:updater:update-ready", function () { onUpdateReady(); });
  Events.On("wails:updater:error", function (e) { onError(e && (e.data != null ? e.data : e)); });

  if (els.btnInstall) els.btnInstall.addEventListener("click", function () { Events.Emit("wails:updater:user:install"); });
  if (els.btnSkip) els.btnSkip.addEventListener("click", function () { Events.Emit("wails:updater:user:skip"); });
  if (els.btnRemind) els.btnRemind.addEventListener("click", function () { Events.Emit("wails:updater:user:remind"); });
  if (els.btnCancel) els.btnCancel.addEventListener("click", function () { Events.Emit("wails:updater:user:cancel"); });
  if (els.btnRestart) els.btnRestart.addEventListener("click", function () { Events.Emit("wails:updater:user:restart"); });
  if (els.btnRetry) els.btnRetry.addEventListener("click", function () {
    resetForRetry();
    Events.Emit("cyrex:updater:retry");
  });
  if (els.btnErrorSkip) els.btnErrorSkip.addEventListener("click", function () {
    Events.Emit("wails:updater:user:cancel");
  });

  setArcPct(0);

  (function announce() {
    if (window._wails && typeof window._wails.invoke === "function") {
      window._wails.invoke("wails:runtime:ready");
      Events.Emit("wails:updater:window:ready");
    } else {
      setTimeout(announce, 30);
    }
  })();
})();
</script>
</body>
</html>
